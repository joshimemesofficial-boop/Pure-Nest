<!DOCTYPE html>
<html>
<head>
<title>PureNest Cosmetics</title>

<style>
body{
  font-family:Arial;
  margin:0;
  background:#FFFDF4;
}

header{
  background:#FFD54F;
  color:#1B5E20;
  text-align:center;
  padding:15px;
  font-size:24px;
  font-weight:bold;
}

.page{display:none;padding:15px;}
#home{display:block;}

.card{
  background:white;
  padding:15px;
  margin:15px 0;
  border-radius:10px;
  box-shadow:0 2px 5px gray;
}

button{
  border:none;
  border-radius:8px;
  padding:10px;
  color:white;
  font-size:16px;
  cursor:pointer;
}

.cartbtn{background:orange;width:100%;margin-top:10px;}
.buy{background:red;width:100%;margin-top:10px;}

footer{
  position:fixed;
  bottom:0;
  width:100%;
  display:flex;
  justify-content:space-around;
  background:#1B5E20;
  padding:10px;
}

footer button{
  background:none;
  color:white;
}
</style>
</head>

<body>

<header>🌿 PureNest Cosmetics</header>

<div id="home" class="page">
  <h2>Welcome to PureNest</h2>

  <div class="card">
    <h3>Lipstick</h3>
    <p>Price: ₹299</p>

    <button class="cartbtn">🛒 Add to Cart</button>
    <button class="buy">🔴 Buy Now</button>
  </div>
</div>

<div id="cart" class="page">
  <h2>🛒 My Cart</h2>
  <div class="card">
    Your cart items will appear here.
  </div>
</div>

<div id="wishlist" class="page">
  <h2>❤️ Wishlist</h2>
  <div class="card">
    No products added yet.
  </div>
</div>

<div id="orders" class="page">
  <h2>📦 My Orders</h2>
  <div class="card">
    <p>Status: Preparing</p>
    <p>Delivery: Tomorrow</p>
  </div>
</div>

<div id="profile" class="page">
  <h2>👤 My Profile</h2>
  <div class="card">
    <p>Name: __________</p>
    <p>Phone: __________</p>
    <p>Address: __________</p>
  </div>
</div>

<footer>
  <button onclick="showPage('home')">🏠 Home</button>
  <button onclick="showPage('orders')">📦 Orders</button>
  <button onclick="showPage('wishlist')">❤️ Wishlist</button>
  <button onclick="showPage('cart')">🛒 Cart</button>
  <button onclick="showPage('profile')">👤 Profile</button>
</footer>

<script>
function showPage(page){
  let pages=["home","cart","wishlist","orders","profile"];

  pages.forEach(function(p){
    document.getElementById(p).style.display="none";
  });

  document.getElementById(page).style.display="block";
}

document.querySelectorAll(".cartbtn").forEach(function(btn){
  btn.onclick=function(){
    alert("Product added to Cart!");
    showPage("cart");
  }
});

document.querySelectorAll(".buy").forEach(function(btn){
  btn.onclick=function(){
    alert("Order placed successfully!");
    showPage("orders");
  }
});
</script>

</body>
</html>
