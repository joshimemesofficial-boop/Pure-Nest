<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PureNest Cosmetics</title>

  <style>
    body{margin:0;font-family:Arial;background:#FFFDF4;}
    header{background:#FFD54F;padding:15px;}
    .logo{font-size:28px;font-weight:bold;color:#1B5E20;}
    .search{background:#fff;padding:10px;border-radius:20px;margin-top:10px;}
    .banner{background:#1B5E20;color:#fff;text-align:center;padding:10px;font-weight:bold;}

    .page{display:none;padding:15px;padding-bottom:80px;}
    .card{background:#fff;padding:15px;border-radius:10px;margin:12px 0;border:1px solid #ddd;}

    input{width:100%;padding:10px;margin:8px 0;box-sizing:border-box;}

    button{width:100%;padding:12px;border:none;border-radius:8px;margin-top:10px;color:white;font-size:16px;}
    .wishbtn{background:#2E7D32;}
    .cartbtn{background:#FF9800;}
    .buy{background:#E53935;}

    footer{position:fixed;bottom:0;left:0;right:0;background:#FFD54F;display:flex;justify-content:space-around;padding:10px;}
    footer button{background:none;color:#1B5E20;width:auto;margin:0;font-size:14px;}
  </style>
</head>
<body>

<header>
  <div class="logo">🌿 PureNest</div>
  <div>📍 Delivery by Tomorrow</div>
  .</div>
</header>

<div class="banner">💚 PURE CHOICES • PURE YOU</div>
<div class="search">
  <input type="text" id="searchInput"
         placeholder="🔍 Search skincare, makeup, haircare..."
         onkeyup="searchProducts()"
         style="width:100%;border:none;outline:none;font-size:16px;">
</dwindowiv id="login" class="page">
  <div class="card">
    <h2>Welcome to PureNest</h2>
    <input id="loginName" placeholder="Full Name">
    <input id="loginPhone" placeholder="Phone Number">
    <input id="loginPassword" type="password" placeholder="Password">
    <button class="wishbtn" onclick="loginUser()">Log In</button>
    <button class="cartbtn" onclick="showPage('signup')">Create Account</button>
  </div>
</div>

<div id="signup" class="page">
  <div class="card">
    <h2>Create Account</h2>
    <input id="signupName" placeholder="Full Name">
    <input id="signupPhone" placeholder="Phone Number">
    <input id="signupAddress" placeholder="Address">
    <input id="signupPassword" type="password" placeholder="Password">
    <button class="wishbtn" onclick="createAccount()">Sign Up</button>
    <button class="cartbtn" onclick="showPage('login')">Back to Login</button>
  </div>
</div>

<div id="home" class="page">
  <h2>Products</h2>
  <div class="card">
    <h3>Lipstick</h3>
    <p>Price: ₹299</p>
    <button class="cartbtn" onclick="addCart()">🛒 Add to Cart</button>
    <button class="buy" onclick="buyNow()">Buy Now</button>
  </div>
</div>

<div id="cart" class="page">
  <h2>🛒 My Cart</h2>
  <div class="card" id="cartBox">Your cart is empty.</div>
</div>

<div id="wishlist" class="page">
  <h2>❤️ Wishlist</h2>
  <div class="card">No products in wishlist.</div>
</div>

<div id="orders" class="page">
  <h2>📦 My Orders</h2>
  <div class="card" id="orderBox">
    No orders yet.
  </div>
</div>

<div id="profile" class="page">
  <h2>👤 My Profile</h2>
  <div class="card" id="profileBox"></div>
</div>

<footer>
  <button onclick="showPage('home')">🏠 Home</button>
  <button onclick="showPage('orders')">📦 Orders</button>
  <button onclick="showPage('wishlist')">❤️ Wishlist</button>
  <button onclick="showPage('cart')">🛒 Cart</button>
  <button onclick="showPage('profile')">👤 Profile</button>
</footer>

<script>
// All website pages
const pages = ["login","signup","home","product","cart","wishlist","orders","profile"];

// Show page
function showPage(page){
  pages.forEach(function(p){
    let el = document.getElementById(p);
    if(el) el.style.display = "none";
  });

  let current = document.getElementById(page);
  if(current) current.style.display = "block";
}

// Create Account
function createAccount(){
  const name = document.getElementById("signupName").value.trim();
  const phone = document.getElementById("signupPhone").value.trim();
  const address = document.getElementById("signupAddress").value.trim();
  const password = document.getElementById("signupPassword").value.trim();

  if(!name || !phone || !address || !password){
    alert("Please fill all details.");
    return;
  }

  localStorage.setItem("name", name);
  localStorage.setItem("phone", phone);
  localStorage.setItem("address", address);
  localStorage.setItem("password", password);

  alert("✅ Account Created Successfully!");
  showPage("login");
}

// Login
function loginUser(){
  const name = document.getElementById("loginName").value.trim();
  const phone = document.getElementById("loginPhone").value.trim();
  const password = document.getElementById("loginPassword").value.trim();

  if(
    name === localStorage.getItem("name") &&
    phone === localStorage.getItem("phone") &&
    password === localStorage.getItem("password")
  ){
    document.getElementById("profileBox").innerHTML =
      "<b>Name:</b> " + name +
      "<br><b>Phone:</b> " + phone +
      "<br><b>Address:</b> " + localStorage.getItem("address");

    alert("✅ Login Successful!");
    showPage("home");
  } else {
    alert("❌ Wrong details or account not created.");
  }
}

// Cart
function addCart(){
  document.getElementById("cartBox").innerHTML =
    "🛒 Lipstick - ₹299 added to your cart.";
  alert("Added to Cart!");
  showPage("cart");
}

// Buy Now
function buyNow(){
  document.getElementById("orderBox").innerHTML =
    "<b>Lipstick</b><br>Status: Preparing<br>Delivery: Tomorrow";
  alert("🎉 Order Placed Successfully!");
  showPage("orders");
}
n Login page first
  function searchProducts() {
  let input = document.getElementById("searchInput").value.toLowerCase();
  let cards = document.querySelectorAll("#home .card");

  cards.forEach(function(card) {
    let text = card.innerText.toLowerCase();
    card.style.display = text.includes(input) ? "block" : "none";
  });
  }
window.onload = function(){
  showPage("login");
};
</script>
</body>
</html>
