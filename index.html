<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PureNest Cosmetics</title>

<style>
body{margin:0;font-family:Arial;background:#FFFDF4;}
header{background:#FFD54F;padding:15px;}
.logo{font-size:28px;font-weight:bold;color:#1B5E20;}
.search{background:white;padding:10px;border-radius:20px;margin-top:10px;}
.banner{background:#1B5E20;color:white;padding:12px;text-align:center;font-weight:bold;}
.products{padding:15px;}
.card{background:white;border:1px solid #ddd;border-radius:12px;padding:15px;margin-bottom:15px;}
.buy{background:#E53935;color:white;padding:10px;border:none;border-radius:8px;width:100%;margin-top:8px;}
.cart{background:#FF9800;color:white;padding:10px;border:none;border-radius:8px;width:100%;margin-top:8px;}
.hidden{display:none;}
footer{position:fixed;bottom:0;width:100%;background:#FFD54F;display:flex;justify-content:space-around;padding:10px;font-weight:bold;}
</style>
</head>

<body>

<header>
<div class="logo">🌿 PureNest</div>
<div>📍 Delivery by Tomorrow</div>
<div class="search">🔍 Search cosmetics...</div>
</header>

<div class="banner">
💚 PURE CHOICES • PURE YOU
</div>

<div class="products">
<h2 style="color:#1B5E20;">Cosmetics</h2>

<p>No products available yet. Products will be added by PureNest Admin.</p>

</div>

<div id="details" class="hidden card">
<h2 id="pname"></h2>

<img id="pimage" src="" width="100%" style="border-radius:10px;">

<p id="pinfo"></p>

<h3>Related Items</h3>
<ul>
<li>Moisturizer</li>
<li>Face Serum</li>
<li>Lip Balm</li>
</ul>

<button class="buy">Buy Now</button>
<button class="cart">Add to Cart</button>

</div>

<footer>
<div>🏠 Home</div>
<div>📦 Orders</div>
<div>❤️ Wishlist</div>
<div>👤 Profile</div>
</footer>

</body>
</html>
